backend = "glx";
glx-no-rebind-pixmap = true;
use-damage = false;

inactive-opacity = 0.75;
active-opacity = 1;
frame-opacity = 1;
inactive-opacity-override = false;
inactive-dim = 0.5;
inactive-dim-fixed = true;
opacity-rule = ["100:class_g = 'jgmenu'",];


blur-background = true;
blur-method = "kernel";
blur-size = 50;
blur-deviation = 3.0;
blur-kern = "9x9gaussian"
blur-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'jgmenu'"
];
shadow = true;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  #"class_g = 'jgmenu'"
];
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;

detect-client-opacity = true;

detect-transient = true;
detect-client-leader = true;

wintypes:
{
	dock = { shadow = true; }
	dnd = { shadow = false; }
	popup_menu = { opacity = 1; }
	dropdown_menu = { opacity = 1; }
};

corner-radius = 15;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  #"class_g = 'jgmenu'",
  "_GTK_FRAME_EXTENTS@:c"
];
